[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad-framework"
version = "1.0.0"
description = "A deep learning framework built from scratch in NumPy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tanishq Mangal", email = "tanishkmangal3@gmail.com"},
]
keywords = ["deep-learning", "autograd", "neural-networks", "numpy", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.6",
]
torch = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/Eternalcodertanishq3/minigrad"
Documentation = "https://github.com/Eternalcodertanishq3/minigrad#readme"
Repository = "https://github.com/Eternalcodertanishq3/minigrad"
Issues = "https://github.com/Eternalcodertanishq3/minigrad/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["minigrad"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
