name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib pytest pytest-cov
        pip install -e ".[dev]"

    - name: Run full test suite
      run: |
        python -m pytest --cov=minigrad --cov-report=xml

    - name: Run scalar autograd example
      run: |
        python examples/01_scalar_autograd.py

    - name: Run XOR example
      run: |
        python examples/03_mlp_xor.py

    - name: Run benchmarks
      run: |
        python benchmarks/bench_ops.py

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install linting tools
      run: |
        pip install ruff mypy
    - name: Run Ruff linter
      run: |
        ruff check minigrad/ tests/ examples/
    - name: Run type checker
      run: |
        mypy minigrad/ --ignore-missing-imports
