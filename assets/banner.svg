<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="b-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="35%" stop-color="#FF9966" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="b-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <radialGradient id="b-glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="0" />
    </radialGradient>
    <filter id="b-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Banner Background Plate -->
  <rect width="1200" height="380" rx="32" fill="#080B11" />
  <rect width="1198" height="378" x="1" y="1" rx="31" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="260" cy="190" r="300" fill="url(#b-glow)" />

  <!-- Subtle Mathematical Coordinate Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="285" x2="1200" y2="285" />
    <line x1="420" y1="0" x2="420" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
  </g>

  <!-- LEFT: LOGO MARK (Scaled & Positioned) -->
  <g transform="translate(60, 25) scale(0.65)" filter="url(#b-shadow)">
    <!-- Canvas Plate for Icon -->
    <rect width="512" height="512" rx="112" fill="#0C0E17" />
    <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
    <circle cx="256" cy="256" r="215" fill="url(#b-glow)" />

    <!-- Wave Grid -->
    <path d="M 72 324 C 136 304, 196 344, 256 324 C 316 304, 376 344, 440 324" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" fill="none" />
    <path d="M 72 192 C 136 172, 196 212, 256 192 C 316 172, 376 212, 440 192" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" fill="none" />

    <!-- Monogram -->
    <path d="M 120 326 L 120 226 C 120 188 152 164 184 164 C 216 164 240 188 240 222 L 240 326"
          stroke="url(#b-brand)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 240 236 C 244 188 276 164 308 164 C 340 164 366 188 366 226 L 366 312 C 366 348 338 372 298 372 C 260 372 236 348 236 316 C 236 284 260 260 296 260 L 364 260"
          stroke="url(#b-brand)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 366 288 L 366 352 C 366 394 336 422 284 422 C 244 422 216 404 204 386"
          stroke="url(#b-brand)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="240" cy="128" r="14" fill="#FF9966" />
    <circle cx="240" cy="128" r="24" stroke="#FF5E62" stroke-width="2" opacity="0.45" />
  </g>

  <!-- RIGHT: TYPOGRAPHY & VALUE PROPOSITION -->
  <g transform="translate(440, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="260" height="28" rx="14" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38BDF8" />
      <text x="26" y="18" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ZERO DEPENDENCIES • PURE NUMPY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#b-text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
      mini<tspan fill="url(#b-brand)">Grad</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="196" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="-0.2">
      A First-Principles Deep Learning &amp; Autograd Framework
    </text>

    <!-- Frontier Tech Feature Badges -->
    <g transform="translate(2, 236)">
      <!-- Badge 1: SUTRA -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">S.U.T.R.A. ODEs</text>
      </g>
      <!-- Badge 2: AVYAYA -->
      <g transform="translate(148, 0)">
        <rect width="158" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">O(1) Memory AVYAYA</text>
      </g>
      <!-- Badge 3: PRAMANA -->
      <g transform="translate(316, 0)">
        <rect width="168" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">P.R.A.M.A.N.A. Moments</text>
      </g>
      <!-- Badge 4: TARKA -->
      <g transform="translate(494, 0)">
        <rect width="180" height="34" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <text x="14" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">T.A.R.K.A. Symbolic Logic</text>
      </g>
    </g>

    <!-- Sanskrit Triple Motto -->
    <text x="4" y="316" fill="rgba(255,255,255,0.35)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="400" letter-spacing="3">
      तर्क (LOGIC)  •  सूत्र (CONTINUITY)  •  स्पन्द (PULSE)
    </text>
  </g>
</svg>