<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="d1-forward" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="d1-reverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="d1-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <filter id="d1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="d1-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Plate (GitHub Dark Canvas) -->
  <rect width="512" height="512" rx="112" fill="#0B0F19" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="210" fill="url(#d1-glow)" />

  <!-- Geometric Grid Accent (Subtle Mathematical Coordinates) -->
  <circle cx="256" cy="256" r="168" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" stroke-dasharray="4 6" />
  <line x1="256" y1="88" x2="256" y2="424" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />
  <line x1="88" y1="256" x2="424" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />

  <!-- THE INTERLOCKING NABLA (Reversible Autograd) -->
  <g filter="url(#d1-shadow)" transform="translate(0, -6)">
    <!-- Arm 1: Top Bar & Left Descent (Forward Propagation) -->
    <!-- Sweeps across the top from x=330 to x=150, curves down left edge to x=240, y=380 -->
    <path d="M 336 128
             L 170 128
             C 134 128 112 168 130 200
             L 224 366
             C 234 384 254 388 266 376
             L 278 364
             C 288 354 286 338 274 328
             L 194 212
             C 186 200 196 182 212 182
             L 336 182
             C 352 182 364 170 364 155
             C 364 140 352 128 336 128 Z"
          fill="url(#d1-forward)" />

    <!-- Arm 2: Right Descent & Reversible Inward Hook (Backward Adjoint / AVYAYA) -->
    <!-- Starts at apex x=256, y=424, rises up right edge to x=382, y=180, curves inward -->
    <path d="M 256 424
             C 246 424 238 418 232 410
             L 196 348
             C 188 334 196 316 212 316
             L 230 316
             C 240 316 248 322 254 330
             L 268 356
             L 354 204
             C 364 186 352 164 332 164
             L 300 164
             C 286 164 276 154 276 140
             C 276 126 286 116 300 116
             L 342 116
             C 378 116 400 156 382 188
             L 280 370
             C 272 384 264 424 256 424 Z"
          fill="url(#d1-reverse)" />

    <!-- Core Focal Point: Gradient Origin Node -->
    <circle cx="256" cy="242" r="12" fill="#FFFFFF" filter="url(#d1-bloom)" />
    <circle cx="256" cy="242" r="22" stroke="url(#d1-forward)" stroke-width="3" opacity="0.6" />
  </g>
</svg>