<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient for SUTRA Dynamic Flow -->
    <linearGradient id="d2-spiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#4FACFE" />
      <stop offset="75%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <radialGradient id="d2-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A11" stop-opacity="0" />
    </radialGradient>
    <filter id="d2-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Plate (Deep Obsidian Canvas) -->
  <rect width="512" height="512" rx="112" fill="#070A11" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="220" fill="url(#d2-glow)" />

  <!-- Instrument Reticle (Mathematical Phase Space) -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="120" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3 6" />
  <circle cx="256" cy="256" r="60" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  
  <!-- Subtle Angle Markings -->
  <line x1="256" y1="64" x2="256" y2="76" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="256" y1="436" x2="256" y2="448" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="64" y1="256" x2="76" y2="256" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="436" y1="256" x2="448" y2="256" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- THE CONTINUOUS SUTRA TRAJECTORY -->
  <!-- Mathematical smooth inward logarithmic spiral -->
  <path d="M 256 76
           C 365 76 436 148 436 256
           C 436 355 355 426 256 426
           C 162 426 96 350 96 256
           C 96 172 152 118 226 118
           C 292 118 344 162 344 230
           C 344 288 302 330 256 330
           C 216 330 182 298 182 256
           C 182 222 208 196 242 196
           C 266 196 282 212 282 236
           L 282 290"
        fill="none"
        stroke="url(#d2-spiral)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#d2-bloom)" />

  <!-- Tangent Gradient Vector Arrow at the Core (Descent Point) -->
  <g transform="translate(282, 290)">
    <path d="M -16 -2 L 0 20 L 16 -2 Z" fill="#00F2FE" />
    <circle cx="0" cy="22" r="5" fill="#FFFFFF" />
  </g>

  <!-- Attractor Focus Point (Global Minimum \min L) -->
  <circle cx="242" cy="256" r="7" fill="#FFFFFF" />
  <circle cx="242" cy="256" r="16" stroke="#00F2FE" stroke-width="2" opacity="0.4" />
</svg>